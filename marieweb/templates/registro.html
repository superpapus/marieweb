{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="{% static '/css/registro.css' %}">
</head>
<body>
    <div class="formulario container">
        <div class="logo"><img src="{% static '/img/logo.png' %}" alt="Logo" style="height: 100px;"></div>
        <h1>Crear Cuenta</h1>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Nombre de Usuario:</label>
                <input type="text" name="username" class="form-control" required id="id_username" placeholder="Ingresa tu nombre de usuario">
            </div>
            <div class="form-group">
                <label for="id_email">Correo Electrónico:</label>
                <input type="email" name="email" class="form-control" required id="id_email" placeholder="Ingresa tu correo electrónico">
            </div>
            <div class="form-group">
                <label for="id_password">Contraseña:</label>
                <input type="password" name="password" class="form-control" required id="id_password" placeholder="Crea una contraseña">
            </div>
            <button type="submit" class="btn-primary">Registrar</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia Sesión</a></p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="error">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
