{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Productos</title>
    <link rel="stylesheet" href="{% static '/css/login.css' %}">
</head>
<body>
    <div class="formulario container">
        <div class="logo">
            <a href="{% url 'inicio' %}"><img src="/static/img/logo.png" alt="Logo"></a>
        </div>
        <h1>{% if producto %}Editar Producto{% else %}Crear Producto{% endif %}</h1>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="error">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value="{{ producto.nombre|default_if_none:'' }}">
            
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion">{{ producto.descripcion|default_if_none:'' }}</textarea>
            
            <label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio" value="{{ producto.precio|default_if_none:'' }}">
            
            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" value="{{ producto.stock|default_if_none:'' }}">
            
            <label for="enabled">Habilitado:</label>
            <input type="checkbox" id="enabled" name="enabled" {% if producto.enabled %}checked{% endif %}>
            
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="submit" name="delete" class="btn_delete" value="delete">Eliminar</button>
        </form>
    </div>
</body>
</html>
