{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static '/css/login.css' %}">
</head>
<body>
    <div class="formulario container">
        <div class="logo"><img src="{% static '/img/logo.png' %}" alt="Logo" style="height: 100px;"></div>
        <h1>Iniciar Sesión</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username:</label>
                <input type="text" name="username" class="form-control" required id="id_username">
            </div>
            <div class="form-group">
                <label for="id_password">Contraseña:</label>
                <input type="password" name="password" class="form-control" required id="id_password">
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>

        <p><a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a></p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="error">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {% if failed_attempts > 0 %}
            <p>Intentos restantes: {{ remaining_attempts }}</p>
        {% endif %}

    </div>
</body>
</html>
